<article
  class="group relative flex flex-col overflow-hidden rounded-2xl border border-white/[0.07] bg-zinc-900/80 shadow-lg shadow-black/50 backdrop-blur-sm transition-all duration-300 hover:-translate-y-1.5 hover:border-gold-500/40 hover:shadow-[0_24px_60px_-18px_rgba(212,160,60,0.3)]"
>
  <div class="relative aspect-[4/3] overflow-hidden bg-zinc-950">
    @if (photoOk()) {
      <img
        [src]="drink().image"
        alt="{{ drink().name }}"
        loading="lazy"
        class="size-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.06]"
        (error)="photoOk.set(false)"
      />
    } @else {
      <div class="absolute inset-0 grid place-items-center bg-gradient-to-br from-zinc-800/80 via-zinc-900 to-zinc-950">
        <span class="text-6xl opacity-15 transition-opacity duration-500 group-hover:opacity-30" aria-hidden="true">🍸</span>
      </div>
    }

    <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-black/50 to-transparent" aria-hidden="true"></div>

    <span
      class="absolute top-3 left-3 rounded-full border px-2.5 py-1 text-[0.62rem] font-bold tracking-[0.14em] uppercase backdrop-blur-md {{ badgeClass() }}"
    >
      {{ drink().category || 'Carta' }}
    </span>
  </div>

  <div class="flex flex-1 flex-col p-5">
    <h2 class="font-serif text-xl leading-snug text-zinc-50 transition-colors duration-300 group-hover:text-gold-200">
      {{ drink().name }}
    </h2>

    @if (drink().description) {
      <p class="mt-2 text-sm leading-relaxed text-zinc-400">{{ drink().description }}</p>
    }
  </div>

  <div class="flex items-end justify-end px-5 pb-5">
    <span class="font-display text-3xl tracking-wide text-gold-400 tabular-nums">{{ price() }}</span>
  </div>
</article>
