<article
  class="group relative flex flex-col overflow-hidden rounded-2xl border border-blush-400/15 bg-zinc-900/90 shadow-[0_18px_45px_-12px_rgba(0,0,0,0.8)] transition-all duration-300 hover:-translate-y-1.5 hover:border-blush-400/40 hover:shadow-[0_28px_60px_-15px_rgba(232,135,154,0.22)]"
>
  <div class="relative aspect-[4/3] overflow-hidden bg-zinc-950">
    @if (photoOk()) {
      <img
        [src]="drink().image"
        alt="{{ drink().name }}"
        loading="lazy"
        class="size-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.06]"
        (error)="photoOk.set(false)"
      />
    } @else {
      <div class="absolute inset-0 grid place-items-center bg-gradient-to-br from-zinc-800/80 via-zinc-900 to-zinc-950">
        <span class="text-6xl opacity-15 transition-opacity duration-500 group-hover:opacity-30" aria-hidden="true">🍸</span>
      </div>
    }

    <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-black/60 to-transparent" aria-hidden="true"></div>

    <span
      class="absolute top-3 left-3 rounded-full border px-2.5 py-1 text-[0.62rem] font-bold tracking-[0.14em] uppercase shadow-md shadow-black/30 {{ badgeClass() }}"
    >
      {{ drink().category || 'Carta' }}
    </span>

    @if (drink().tag) {
      <span
        class="absolute top-3 right-3 rounded-full bg-red-600/90 px-2.5 py-1 text-[0.62rem] font-bold tracking-[0.14em] text-white uppercase shadow-lg shadow-black/40"
      >
        {{ drink().tag }}
      </span>
    }
  </div>

  <div class="flex flex-1 flex-col p-5">
    <h2 class="font-serif text-2xl font-semibold leading-tight text-zinc-50 transition-colors duration-300 group-hover:text-blush-300">
      {{ drink().name }}
    </h2>

    @if (drink().description) {
      <p class="mt-2 text-sm leading-relaxed text-zinc-400">{{ drink().description }}</p>
    }

    <!-- Precio -->
    <div class="mt-auto flex items-end justify-between pt-4">
      <span
        class="h-px w-10 bg-gradient-to-r from-gold-500/70 to-transparent self-center"
        aria-hidden="true"
      ></span>
      <span class="text-2xl font-extrabold tracking-tight text-gold-400 tabular-nums sm:text-3xl">
        {{ price() }}
      </span>
    </div>
  </div>
</article>
